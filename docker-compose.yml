services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: financas
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: meurumo-financas:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://financas:${POSTGRES_PASSWORD}@db:5432/financas
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    # Exposto só para a própria VPS. Seu Nginx/Traefik/Caddy aponta para cá.
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"

  # Backup diário do banco (guarda 30 dias em ./backups)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U financas financas | gzip > /backups/financas-$$(date +%F).sql.gz &&
        find /backups -name "*.sql.gz" -mtime +30 -delete;
        sleep 86400; done'

  # HTTPS automático (opcional): use se nada mais estiver usando as portas 80/443 da VPS.
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
